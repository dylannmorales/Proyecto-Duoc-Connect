name: CI

# Corre las pruebas en cada push y en cada pull request.
# Si algo falla, GitHub muestra una X roja en el commit o en el PR.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas unitarias y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas unitarias
        run: mvn -B test
      - name: Resumen de cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          print("### Cobertura del backend (JaCoCo)\n\n| Métrica | Cubierto | Total | % |\n|---|---|---|---|")
          for k, nombre in [("LINE", "Líneas"), ("BRANCH", "Ramas"), ("INSTRUCTION", "Instrucciones")]:
              c = sum(int(r[k + "_COVERED"]) for r in rows)
              t = c + sum(int(r[k + "_MISSED"]) for r in rows)
              print(f"| {nombre} | {c} | {t} | {100 * c / t:.1f} % |")
          PY
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-backend
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports

  frontend:
    name: Frontend (tipos, lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos y build
        run: npm run build
