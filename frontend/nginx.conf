# Cabeceras para el WebSocket: si el cliente pide "Upgrade", se reenvía; si no, se cierra normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # El backend valida el tamaño (PDF hasta 10 MB); nginx no debe cortar antes (su límite por defecto es 1 MB).
    client_max_body_size 15m;

    # SPA: cualquier ruta de React Router devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos subidos (fotos de perfil, imágenes del foro).
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Chat en tiempo real: SockJS (/ws) y WebSocket nativo (/ws-native).
    location ~ ^/(ws|ws-native)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Una conexión de chat puede quedar abierta mucho tiempo sin tráfico (hay heartbeats cada 10 s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
