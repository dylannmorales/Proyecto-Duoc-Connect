services:
  postgres:
    image: postgres:16-alpine
    container_name: duoc-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duoc_connect}
      POSTGRES_USER: ${POSTGRES_USER:-duoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duoc_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duoc} -d ${POSTGRES_DB:-duoc_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
