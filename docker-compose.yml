services:
  postgres:
    image: postgres:16-alpine
    container_name: duoc-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duoc_connect}
      POSTGRES_USER: ${POSTGRES_USER:-duoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duoc_secret}
    ports:
      # POSTGRES_PORT permite usar otro puerto si ya hay un PostgreSQL instalado en el equipo.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duoc} -d ${POSTGRES_DB:-duoc_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duoc-connect-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Variables del .env (versionado) y de .env.local (opcional, no versionado: claves reales de AWS).
    # .env.local pisa a .env. Así llegan AWS_S3_ENABLED, AWS_S3_BUCKET, AWS_REGION y las claves.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    # Lo de "environment" tiene prioridad sobre env_file (dentro de Docker la BD es el servicio "postgres").
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-duoc_connect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-duoc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-duoc_secret}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: duoc-connect-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"

volumes:
  postgres_data:
    # POSTGRES_VOLUME permite reutilizar un volumen existente con datos.
    name: ${POSTGRES_VOLUME:-proyecto-duoc-connect_postgres_data}
  uploads_data:
