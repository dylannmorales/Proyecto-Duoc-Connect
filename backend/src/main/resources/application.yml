spring:
  application:
    name: duoc-connect
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/duoc_connect}
    username: ${SPRING_DATASOURCE_USERNAME:duoc}
    password: ${SPRING_DATASOURCE_PASSWORD:duoc_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Algo sobre 10 MB para que la validación propia responda "El PDF no puede superar 10 MB".
      max-file-size: 11MB
      max-request-size: 13MB

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  # Los PDF de apuntes se guardan en S3 cuando AWS_S3_ENABLED=true; si no, en app.upload.path.
  # Credenciales: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (variables o .env); si faltan,
  # se usa la cadena estándar de AWS (~/.aws/credentials, rol de la instancia, etc.).
  storage:
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:duoc-connect}
      region: ${AWS_REGION:us-east-2}
      prefix: ${AWS_S3_PREFIX:apuntes/}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Administrador inicial. Si no se define ADMIN_PASSWORD no se crea (salvo en dev, ver application-dev.yml).
  admin:
    email: ${ADMIN_EMAIL:admin@duocuc.cl}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
